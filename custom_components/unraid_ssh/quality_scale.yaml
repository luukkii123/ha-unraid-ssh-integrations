# Integration Quality Scale — as of 10.09.2026.
# Bronze is the minimum (docs/ui-regeln.md, rule 3). manifest.json deliberately
# carries no quality_scale key while config-flow-test-coverage is still open.
rules:
  action-setup:
    status: exempt
    comment: No services are registered; everything is an entity (switch, update, button).
  appropriate-polling:
    status: done
    comment: One DataUpdateCoordinator per entry, 30 s default (10–300 s), one SSH round trip per poll.
  brands: done
  common-modules:
    status: done
    comment: coordinator.py, entity.py, ssh.py (transport), parse.py/model.py (pure logic).
  config-flow-test-coverage:
    status: todo
    comment: >-
      tests/ covers parse.py, collect.py, model.py, the SSH transport (against an
      in-process asyncssh server) and the translation files — 82 tests. The config
      flow itself is never executed: that needs pytest-homeassistant-custom-component.
  config-flow: done
  dependency-transparency:
    status: done
    comment: requirements pins asyncssh==2.24.0 (MIT/EPL, on PyPI).
  docs-actions:
    status: exempt
    comment: No services.
  docs-high-level-description:
    status: done
    comment: README, head.
  docs-installation-instructions:
    status: done
    comment: README, "Installation".
  docs-removal-instructions:
    status: done
    comment: README, "Entfernen".
  entity-event-setup:
    status: exempt
    comment: Entities are CoordinatorEntity subclasses; no own subscriptions.
  entity-unique-id:
    status: done
    comment: "entity.py: entry_id + per-entity suffix."
  has-entity-name:
    status: done
    comment: "entity.py: _attr_has_entity_name = True."
  runtime-data:
    status: done
    comment: entry.runtime_data holds UnraidRuntime; hass.data is unused.
  test-before-configure:
    status: done
    comment: validate() runs `cat var.ini` over SSH with the generated key before the entry is created.
  test-before-setup:
    status: done
    comment: async_setup_entry calls async_config_entry_first_refresh().
  unique-config-entry:
    status: done
    comment: unique_id = host:port with _abort_if_unique_id_configured().
