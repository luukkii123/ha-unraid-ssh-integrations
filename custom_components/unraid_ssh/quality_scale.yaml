# Integration Quality Scale — geprüft am 05.10.2026.
# Alle aktuellen Bronze-Regeln; tests_ha dokumentiert reproduzierbare Nachweise.
# Siehe Verwaltungsreview 2026-10-05-bronze-nachweise.md für die Grenzen.
rules:
  action-setup:
    status: exempt
    comment: No services are registered; everything is an entity (switch, update, button).
  appropriate-polling:
    status: done
    comment: One DataUpdateCoordinator per entry, 30 s default (10–300 s), one SSH round trip per poll.
  brands: done
  common-modules:
    status: done
    comment: coordinator.py, entity.py, ssh.py (transport), parse.py/model.py (pure logic).
  config-flow-test-coverage:
    status: done
    comment: >-
      tests_ha/test_config_flow.py führt echte HA-Flowmanager aus. Config-,
      Options- und vorhandene Reauth/Reconfigure-Flows einschließlich
      Fehler-Recovery und Dubletten: 100 % Zeilen- und Zweigabdeckung,
      --cov-branch --cov-fail-under=100, HA 2026.7.0 und 2026.9.2.
  config-flow: done
  dependency-transparency:
    status: todo
    comment: >-
      PyPI, OSI-Lizenz und öffentlicher Release-Tag für asyncssh 2.24.0 belegt.
      Öffentliche Workflows am Tag enthalten Tests, aber keinen belegten
      Build-/Publish-Schritt zu PyPI. Dieser seit 30.09.2026 ausdrücklich
      geforderte Nachweis fehlt; deshalb kein quality_scale im Manifest.
  docs-actions:
    status: exempt
    comment: No services.
  docs-triggers:
    status: exempt
    comment: Keine eigenen Automations-Trigger bereitgestellt.
  docs-conditions:
    status: exempt
    comment: Keine eigenen Automations-Bedingungen bereitgestellt.
  docs-high-level-description:
    status: done
    comment: README, head.
  docs-installation-instructions:
    status: done
    comment: README, "Installation".
  docs-removal-instructions:
    status: done
    comment: README, "Entfernen".
  entity-event-setup:
    status: done
    comment: >-
      CoordinatorEntity registriert Listener in async_added_to_hass und
      entfernt sie über async_on_remove. Unraid-Zusatzlistener in
      ContainerUpdate und ContainerPictureMixin folgen demselben Lebenszyklus.
  entity-unique-id:
    status: done
    comment: "entity.py: entry_id + per-entity suffix."
  has-entity-name:
    status: done
    comment: "entity.py: _attr_has_entity_name = True."
  runtime-data:
    status: done
    comment: entry.runtime_data holds UnraidRuntime; hass.data is unused.
  test-before-configure:
    status: done
    comment: validate() runs `cat var.ini` over SSH with the generated key before the entry is created.
  test-before-setup:
    status: done
    comment: async_setup_entry calls async_config_entry_first_refresh().
  unique-config-entry:
    status: done
    comment: unique_id = host:port with _abort_if_unique_id_configured().
