name: Release

# Pushing a tag is enough. This workflow creates the release itself — before,
# it had to be made through the GitHub API or in the browser, which needed a
# personal access token. The action's own `GITHUB_TOKEN` covers this.
#
# Unlike the card repos, **no asset** is attached: for an integration HACS
# pulls the `custom_components/<domain>/` folder straight from the tagged tree.
on:
  push:
    tags:
      - "v*"
  # Can also be triggered after the fact, when the tag already exists.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/unraid_ssh/manifest.json'))['version'])")
          echo "Tag: $tag - manifest.json: $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::The version in manifest.json ($manifest) does not match the tag ($tag)."
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
